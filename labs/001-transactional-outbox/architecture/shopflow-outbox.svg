<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"><rect width="1200" height="750" rx="22" fill="#f8fafc"/><text x="42" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#172554">SHOPFLOW — THE ORDER THAT NEVER REACHED THE WAREHOUSE</text><text x="42" y="88" font-family="Arial" font-size="18" fill="#475569">Rahul orders headphones (₹2,500). One order must produce a durable notification.</text><rect x="45" y="135" width="245" height="125" rx="18" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="61" y="179" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">ORDER SERVICE</text><text x="61" y="216" font-family="Arial" font-size="18" fill="#334155">OrderCreated</text><rect x="345" y="135" width="245" height="125" rx="18" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="361" y="179" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">POSTGRESQL</text><text x="361" y="216" font-family="Arial" font-size="18" fill="#334155">orders + outbox</text><rect x="645" y="135" width="245" height="125" rx="18" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="661" y="179" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">PYTHON RELAY</text><text x="661" y="216" font-family="Arial" font-size="18" fill="#334155">Publish / ACK</text><rect x="945" y="135" width="245" height="125" rx="18" fill="#dcfce7" stroke="#64748b" stroke-width="2"/><text x="961" y="179" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b">KAFKA</text><text x="961" y="216" font-family="Arial" font-size="18" fill="#334155">3 brokers</text><path d="M290 196h55m245 0h55m245 0h55" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 4"/><rect x="45" y="295" width="1145" height="150" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="68" y="335" font-family="Arial" font-size="23" font-weight="bold" fill="#9a3412">BREAK: KAFKA ACK → RELAY CRASH → RESTART</text><text x="68" y="375" font-family="Arial" font-size="19" fill="#7c2d12">Event 2222… published twice: partition 1 offset 0, then partition 1 offset 1.</text><text x="68" y="408" font-family="Arial" font-size="19" fill="#7c2d12">PostgreSQL published_at stayed NULL after crash → relay retried the same event.</text><rect x="45" y="480" width="555" height="185" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="68" y="520" font-family="Arial" font-size="23" font-weight="bold" fill="#166534">FIX VERIFIED: IDEMPOTENT SQL</text><text x="68" y="557" font-family="Arial" font-size="18" fill="#14532d">Unique event ID + INSERT RETURNING</text><text x="68" y="587" font-family="Arial" font-size="18" fill="#14532d">Duplicate → UPDATE 0</text><text x="68" y="617" font-family="Arial" font-size="18" fill="#14532d">Inventory remains 9 available / 1 reserved</text><rect x="630" y="480" width="560" height="185" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="654" y="520" font-family="Arial" font-size="23" font-weight="bold" fill="#92400e">TRADE-OFFS</text><text x="654" y="557" font-family="Arial" font-size="18" fill="#78350f">Duplicates • eventual consistency • relay lag</text><text x="654" y="587" font-family="Arial" font-size="18" fill="#78350f">Cleanup • monitoring • worker coordination</text><text x="654" y="617" font-family="Arial" font-size="18" fill="#78350f">Use: orders, payments, durable async jobs</text><text x="45" y="710" font-family="Arial" font-size="17" fill="#64748b">Verified SQL experiments only. Python inventory consumer and offset recovery are future work.</text></svg>