services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: shopflow
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d shopflow"]
      interval: 2s
      retries: 20
    volumes:
      - saga_pg:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://saga:localdev@postgres:5432/shopflow
    ports:
      - "8802:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  saga_pg:
